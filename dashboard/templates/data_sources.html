<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDITH · Data Sources</title>
  <style>
    :root{ --bg:#0A1220; --card:#111E30; --card2:#16263C; --line:rgba(238,244,250,.08);
      --text:#E8EFF6; --text2:#A7BCD2; --muted:#71889F; --brand:#5B9BD0; --risk:#E0795B; --ok:#4FB286; --amber:#E0B85B; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-size:14px;line-height:1.5;padding:24px;max-width:920px;margin:0 auto}
    h1{font-size:22px;font-weight:600;margin:0 0 2px}
    .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
    a{color:var(--brand);text-decoration:none}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
    button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--text2);border-radius:7px;padding:7px 14px;font-size:13px}
    button:hover{color:var(--text);border-color:var(--brand)}
    button.primary{border-color:rgba(91,155,208,.5);color:#cfe4f6}
    button:disabled{opacity:.5;cursor:default}
    .banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:none}
    .banner.ok{display:block;background:rgba(79,178,134,.10);border:1px solid var(--ok);color:#9fe0c4}
    .banner.bad{display:block;background:rgba(224,121,91,.12);border:1px solid var(--risk);color:#f0b8a6}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
    .src{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
    .src .name{font-weight:600}
    .src .feeds{color:var(--muted);font-size:12px;margin-top:2px}
    .src .meta{color:var(--text2);font-size:12px;margin-top:6px;line-height:1.7}
    .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600}
    .pill.ok{background:rgba(79,178,134,.14);color:var(--ok)}
    .pill.fail{background:rgba(224,121,91,.16);color:var(--risk)}
    .pill.none{background:var(--card2);color:var(--muted)}
    .err{color:#f0b8a6;font-size:12px;margin-top:4px}
    .empty{color:var(--muted);font-style:italic;padding:8px 0}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--brand);color:var(--text);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <h1>EDITH · Data Sources</h1>
  <div class="sub">What's plugged into EDITH's system, and how fresh each source is. The raw sheets
    are the source of truth; a Postgres <b>mirror</b> is kept current by a background sync (and your
    "resync" command), and EDITH reads the mirror. <a href="/dashboard/">← back to dashboard</a></div>

  <div id="banner" class="banner"></div>

  <div class="toolbar">
    <button id="resync" class="primary">↻ Resync now</button>
    <button id="refresh">Refresh panel</button>
    <span id="interval" class="sub" style="margin:0"></span>
  </div>

  <div id="sources"></div>
  <div class="toast" id="toast"></div>

  <script>
  (function(){
    function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
    function ago(iso){ if(!iso) return 'never'; var d=new Date(iso); var s=Math.round((Date.now()-d)/1000);
      if(s<60) return s+'s ago'; if(s<3600) return Math.round(s/60)+'m ago'; if(s<86400) return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; }
    function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}

    async function load(){
      var data;
      try{ data = await (await fetch('/dashboard/api/data-sources')).json(); }
      catch(e){ document.getElementById('sources').innerHTML='<div class="empty">Could not load sources.</div>'; return; }
      var srcs = data.sources || [];
      document.getElementById('interval').textContent = data.interval_seconds ? ('background sync every '+data.interval_seconds+'s') : '';
      var banner=document.getElementById('banner');
      var failed = srcs.filter(function(s){return s.last_sync_status!=='ok';});
      if(!srcs.length){ banner.className='banner'; }
      else if(failed.length){ banner.className='banner bad'; banner.textContent='⚠ '+failed.length+' source(s) failed to sync — EDITH is flagging stale data, not using it silently.'; }
      else { banner.className='banner ok'; banner.textContent='All '+srcs.length+' sources current.'; }

      var el=document.getElementById('sources');
      if(!srcs.length){ el.innerHTML='<div class="empty">No mirror state yet — the first sync hasn\'t run, or the data layer is offline (EDITH reads sheets live meanwhile).</div>'; return; }
      el.innerHTML = srcs.map(function(s){
        var st = s.last_sync_status==='ok' ? '<span class="pill ok">OK</span>'
               : s.last_sync_status==='failed' ? '<span class="pill fail">FAILED</span>'
               : '<span class="pill none">—</span>';
        return '<div class="card"><div class="src"><div>'
          + '<div class="name">'+esc(s.tab_name)+' '+st+'</div>'
          + '<div class="feeds">feeds: '+esc(s.feeds)+'</div>'
          + '<div class="meta">'+ (s.row_count!=null?s.row_count+' rows · ':'')
          + 'checked '+ago(s.last_sync_at)+' · last changed '+ago(s.last_change_detected_at)+'</div>'
          + (s.last_error?'<div class="err">'+esc(s.last_error)+'</div>':'')
          + '</div></div></div>';
      }).join('');
    }

    document.getElementById('resync').addEventListener('click', async function(){
      var b=this; b.disabled=true; b.textContent='Syncing…';
      try{
        var r = await (await fetch('/dashboard/api/resync',{method:'POST'})).json();
        var ch = (r.sync && r.sync.changed) || [];
        toast(ch.length ? ('Synced — updated: '+ch.join(', ')) : 'Synced — no changes');
      }catch(e){ toast('Resync failed'); }
      b.disabled=false; b.textContent='↻ Resync now'; load();
    });
    document.getElementById('refresh').addEventListener('click', load);
    load();
  })();
  </script>
</body>
</html>

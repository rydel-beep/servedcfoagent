<section class="panel brief-panel" id="section-brief">
    <div class="panel-header">
      <h2 class="panel-title">Morning Brief</h2>
      <span class="panel-sub" id="brief-date"></span>
    </div>
    <div id="brief-body"><div class="skeleton skeleton-hero"></div></div>
  </section>

<section class="panel exec-panel" id="section-exec">
    <div class="panel-header">
      <h2 class="panel-title">Executive Summary</h2>
      <span class="panel-sub" id="exec-date"></span>
    </div>
    <div class="exec-body" id="exec-body"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
  </section>

<section class="panel" id="section-actions" style="display:none;">
    <div class="panel-header">
      <h2 class="panel-title">Action Items</h2>
      <div class="panel-badge" id="actions-badge"></div>
    </div>
    <div id="actions-content"></div>
  </section>

<section class="panel" id="section-verdicts">
      <div class="panel-header">
        <h2 class="panel-title">Verdicts</h2>
      </div>
      <div class="verdict-headline" id="verdict-headline">Loading...</div>
      <div class="leaks-list" id="leaks-list"></div>
      <div class="wins-row" id="wins-row"></div>
    </section>

<section class="panel" id="section-action-feed">
    <div class="panel-header"><h2 class="panel-title">What needs action</h2>
      <div class="panel-badge" id="action-feed-badge"></div></div>
    <div id="action-feed-body"><div class="skeleton skeleton-text"></div></div>
  </section>
